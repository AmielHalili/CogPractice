AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bank app API - HTTP API (payload format 2.0), single Lambda wrapping the Express app via serverless-http.

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
    Description: MongoDB connection string (Atlas SRV URI, etc.)
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign/verify JWTs.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        MONGO_URI: !Ref MongoUri
        JWT_SECRET: !Ref JwtSecret

Resources:
  BankHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
        AllowHeaders:
          - content-type
          - authorization

  BankApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BankHttpApi
            Path: /api/bank/{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${BankHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
